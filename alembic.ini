# INF-001 - Alembic migration infrastructure.
#
# Schema migrations themselves are NOT written here (that is DB-001 and later).
# Compatible versions are pinned in requirements.txt: SQLAlchemy 2.0.36 + Alembic 1.14.1.
#
# NOTE: keep this file ASCII-only. Non-ASCII comments are read by configparser
# using the platform encoding and break Alembic on Windows (cp1252).
#
# The database URL is taken from the DATABASE_URL environment variable
# (see alembic/env.py); nothing secret is stored in this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# IMPORTANT: the value must stay empty. An inline comment after the value is
# NOT stripped by configparser - it becomes the URL itself and breaks Alembic.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
