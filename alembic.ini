# INF-001 — инфраструктура миграций Alembic.
# Сами миграции схемы НЕ пишутся (это DB-001). Каталог versions/ пуст.
# Совместимые версии зафиксированы в requirements.txt: SQLAlchemy 2.0.36 + Alembic 1.14.1.
#
# URL задаётся через переменную окружения DATABASE_URL (читается в alembic/env.py),
# а не хранится в этом файле — секретов здесь нет.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =          # переопределяется в env.py из DATABASE_URL

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
