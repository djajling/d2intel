name: CI

# INF-001: CI запускает линтер/типизацию/тесты. Воспроизводимая установка
# pinned-зависимостей; PostgreSQL поднимается как service-контейнер
# (не оркестрация приложения — это локальный CI-стек).
# Запрещённых компонентов нет: Redis/Celery/Kafka/K8s/feature-store/MLflow.

on:
  push:
    branches: ["main", "task/INF-*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17.4
        env:
          POSTGRES_USER: d2intel
          POSTGRES_PASSWORD: d2intel_dev
          POSTGRES_DB: d2intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U d2intel -d d2intel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://d2intel:d2intel_dev@localhost:5432/d2intel
      # DB-001: миграционные тесты разрушительны (downgrade base) — отдельная БД.
      D2INTEL_TEST_DATABASE_URL: postgresql+psycopg://d2intel:d2intel_dev@localhost:5432/d2intel_test
      APP_NAME: d2intel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U d2intel -d d2intel >/dev/null 2>&1; then
              echo "Postgres is ready"; exit 0
            fi
            sleep 1
          done
          echo "Postgres not ready"; exit 1

      - name: Create test database (DB-001)
        run: |
          export PGPASSWORD=d2intel_dev
          if ! psql -h localhost -p 5432 -U d2intel -d d2intel -tAc \
               "SELECT 1 FROM pg_database WHERE datname='d2intel_test'" | grep -q 1; then
            psql -h localhost -p 5432 -U d2intel -d d2intel -c "CREATE DATABASE d2intel_test;"
          fi

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Mypy (types)
        run: mypy src

      - name: Pytest (smoke)
        run: pytest -v
